<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Análises municipais de cana-de-açúcar, produção e clima no Brasil.">
  <title>Sugar Cane Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="stylesheet" href="follow-up-suggestions.css?v=1">
  <link rel="stylesheet" href="chat-animations.css?v=28">
  <link rel="stylesheet" href="chat-minimal-suggestions.css?v=2">
  <link rel="stylesheet" href="agriculture-green.css?v=12">
  <link rel="stylesheet" href="question-builder.css?v=3">
  <link rel="stylesheet" href="question-builder-icons.css?v=2">
  <link rel="stylesheet" href="question-wizard.css?v=2">
  <link rel="stylesheet" href="answer-neutral-surfaces.css?v=5">
  <link rel="stylesheet" href="locale-ui.css?v=3">
  <link rel="stylesheet" href="question-builder-slide.css?v=2">
  <link rel="stylesheet" href="dark-flat-overlays.css?v=3">
  <link rel="stylesheet" href="question-builder-light.css?v=6">
  <link rel="stylesheet" href="question-scope.css?v=9">
  <link rel="stylesheet" href="question-correction.css?v=3">
  <link rel="stylesheet" href="question-correction-combobox.css?v=4">
</head>
<body>
  <header class="topbar">
    <button class="brand-icon" id="new-chat" title="Novo chat" aria-label="Novo chat">🌱</button>
    <div class="brand-copy"><strong>Sugar Cane Intelligence</strong><span>Desenvolvido por Gabriel Delvaje</span></div>
    <button class="theme-button" id="theme-toggle" aria-label="Alternar tema">◐</button>
  </header>
  <main class="page-shell">
    <section class="hero" id="home-hero">
      <h1>O que você quer saber sobre a cana?</h1>
      <p>Consulte produção, área, produtividade, temperatura, chuva, municípios e períodos.</p>
      <div class="suggestions" id="suggestions">
        <button class="sci-capability-suggestion">O que você pode fazer?</button>
        <button>Quais são os 5 municípios com maior produção em São Paulo?</button>
        <button>Compare a produção de Piracicaba e Ribeirão Preto entre 2010 e 2024.</button>
        <button>Qual município teve maior precipitação em 2024?</button>
      </div>
    </section>
    <section class="status-card" id="loading-card" aria-live="polite"><span class="loader"></span><div><strong>Carregando base integrada</strong><small>PAM/IBGE + CRU TS, de 1974 a 2024.</small></div></section>
    <section id="conversation" class="conversation" aria-live="polite"></section>
  </main>
  <form class="question-bar" id="question-form">
    <label class="sr-only" for="question">Sua pergunta</label>
    <input id="question" autocomplete="off" placeholder="Pergunte sobre produção, clima ou municípios...">
    <button type="submit" aria-label="Enviar pergunta"><svg class="submit-snake-loader submit-idle-arrow" viewBox="0 0 24 24" aria-hidden="true"><path class="submit-snake-shaft" d="M12 19 L12 9"></path><path class="submit-snake-head" d="M12.64 5.64 Q12 5 11.36 5.64 L8.64 8.36 Q8 9 8.95 9 L15.05 9 Q16 9 15.36 8.36 Z"></path></svg></button>
  </form>
  <template id="message-template"><article class="message"><div class="message-icon"></div><div class="message-content"></div></article></template>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script src="app.js?v=10"></script>
  <script src="state-name-filter.js?v=1"></script>
  <script src="municipality-matching.js?v=2"></script>
  <script src="positive-comparisons.js?v=2"></script>
  <script src="single-leader-cards.js?v=1"></script>
  <script src="inline-answer-intros.js?v=2"></script>
  <script src="single-year-municipality.js?v=1"></script>
  <script src="historical-line-charts.js?v=3"></script>
  <script src="ranking-bar-charts.js?v=3"></script>
  <script src="chat-ui-v5.js?v=36"></script>
  <script src="follow-up-entrance.js?v=1"></script>
  <script src="submit-arrowhead-alignment.js?v=5"></script>
  <script src="dynamic-questions.js?v=5"></script>
  <script src="suggestion-state-labels.js?v=1"></script>
  <script src="question-builder.js?v=4"></script>
  <script src="question-builder-slide.js?v=2"></script>
  <script src="question-builder-icons.js?v=1"></script>
  <script src="question-wizard.js?v=2"></script>
  <script src="question-wizard-animation-cleanup.js?v=1"></script>
  <script src="locale-answers.js?v=3"></script>
  <script src="locale-state-bridge.js?v=1"></script>
  <script src="locale-ui-dictionary.js?v=2"></script>
  <script src="locale-ui-stable.js?v=4"></script>
  <script src="locale-followups.js?v=5"></script>
  <script src="question-scope.js?v=5"></script>
  <script src="question-correction.js?v=5"></script>
  <script src="question-correction-combobox.js?v=3"></script>
</body>
</html>
