name: Validate question scope in browser

on:
  push:
    paths:
      - 'question-scope.js'
      - 'chat-ui-v5.js'
      - 'chat-staged-sections.js'
      - 'follow-up-entrance.js'
      - 'historical-line-charts.js'
      - 'locale-answers.js'
      - 'dynamic-questions.js'
      - 'como-foi-i18n.js'
      - 'indicator-synonyms.js'
      - 'styles.css'
      - 'locale-ui-dictionary.js'
      - 'question-scope.css'
      - 'question-correction.js'
      - 'question-correction.css'
      - 'question-correction-combobox.js'
      - 'question-correction-combobox.css'
      - 'municipality-matching.js'
      - 'locale-ui-stable.js'
      - 'index.html'
      - 'tests/question-scope.browser.cjs'
      - 'tests/implicit-production.browser.cjs'
      - 'tests/question-correction.browser.cjs'
      - 'tests/historical-trend.browser.cjs'
      - 'tests/indicator-synonyms.browser.cjs'
      - 'tests/como-foi.browser.cjs'
      - 'tests/staged-sections.browser.cjs'
      - '.github/workflows/question-scope-browser.yml'
  workflow_dispatch:

jobs:
  browser-question-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Launch local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sci-scope-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sci-scope-http.log
          exit 1
      - name: Check scope, indicators, correction and sequential response reveal
        run: node --check chat-staged-sections.js && node --check follow-up-entrance.js && node --check como-foi-i18n.js && node --check dynamic-questions.js && node --check question-scope.js && node --check locale-ui-stable.js && node --check indicator-synonyms.js && node --check question-correction.js && node --check question-correction-combobox.js && node --check historical-line-charts.js && node --test tests/question-scope.browser.cjs tests/implicit-production.browser.cjs tests/question-correction.browser.cjs tests/historical-trend.browser.cjs tests/indicator-synonyms.browser.cjs tests/como-foi.browser.cjs tests/staged-sections.browser.cjs
